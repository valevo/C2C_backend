# Static user-facing strings, keyed by message ID and then by ISO 639-1 language code.
# Supported languages: en, nl, fr (must match LanguageCode in models.py).

meta:
  supported_languages: en, nl, fr
  last_edited: 2026-09-09T18:44:00
  

example: |
  this is a multi-line string

  it has paragraphs, weird characters :*&@#(*E&YUHJ"!L@#K"!P#)OI{_!#(*$)&!&#*T and whatever else you need.

  the important thing is the two spaces in front of it -> this indicates that the multi-line string isn't over yet
second_key: "here, the multi-line string is over"
  nested_key: |
    another multi-line string, that's nested inside of a key
    notice the indentation
  second_nested_key: 13

welcome:
  introduction:
    en: Welcome
    nl: Welkom
    fr: Bienvenue
  no_cookies:
    en: We don't use cookies
    nl: We gebruiken geen cookies
    fr: Nous n'utilisons pas de cookies
  description:
    en: Comment to Conversation generates no new content. It only stores comments and rearranges them into ever-changing conversations.
    nl: Van Commentaar tot Conversatie genereert geen nieuwe inhoud. Het slaat alleen opmerkingen op en herschikt ze tot steeds veranderende gesprekken.
    fr: Du Commentaire à la Conversation ne génère aucun nouveau contenu. Il se contente d’enregistrer des commentaires et de les réorganiser en conversations en perpétuelle évolution.
  agree:
    en: Ok
    nl: Oke
    fr: D'accord


main:
  about:
    en: what is C2C?
    nl: wat is C2C?
    fr: qu'est-ce que C2C ?
  rules:
    en: terms
    nl: spelregels
    fr: conditions
  reply_comment_button:
    en: Click on a comment above ↑ to join the conversation
    nl: Klik op een reactie hierboven ↑ om deel te nemen aan het gesprek
    fr: Cliquez sur un commentaire ci-dessus ↑ pour participer à la conversation
  new_comment_button:
    en: Click here ← to start a new conversation
    nl: Klik hier ← om een nieuw gesprek te starten
    fr: Cliquez ici ← pour commencer une nouvelle conversation
  flag_button:
    en: Flag this comment
    nl: Meld deze reactie
    fr: Signaler ce commentaire


