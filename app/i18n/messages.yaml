new_comment_result:
  note:
    en: Thank you for your contribution. Your comment has been added to the conversation.
    nl: Bedankt voor uw bijdrage. Uw opmerking is toegevoegd aan de conversatie.
    fr: Merci pour votre contribution. Votre commentaire a été ajouté à la conversation.

flag:
  reason:
    en: Optionally, share your reason for flagging this comment
    nl: Licht eventueel toe waarom je deze reactie meldt
    fr: Si vous le souhaitez, indiquez pourquoi vous signalez ce commentaire
  donotshow:
    en: This comment should not be public
    nl: Deze opmerking zou niet openbaar mogen zijn
    fr: Ce commentaire ne devrait pas être public

error:
  invalid_message:
    en: The message could not be understood.
    nl: Het bericht kon niet worden verwerkt.
