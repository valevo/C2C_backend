aboutpage:
  header:
    en: what is C2C?
    nl: wat is C2C?
    fr: qu'est-ce que C2C ?
  about:
    en: |
      Museum exhibitions often speak of “starting a conversation.” But who gets to take part—and how does that conversation continue?
      Visitor comments are often collected, but rarely connected. Comment to Conversation explores what happens when they are—creating opportunities for you to encounter and respond to what others have said, and for conversations to unfold over time.
      C2C starts from the idea of dialogue: not simply as speaking, but as a process in which speaking asks us to listen, and listening opens the possibility to respond.
      The conversations you encounter are not a fixed script. C2C continually rearranges existing comments to bring different connections into view. They take shape through the people who participate, the exhibition they are responding to, and the space they share. Some will resonate, challenge, or surprise—others will lead nowhere, as conversations sometimes do.
    nl:  |
      Museumtentoonstellingen spreken vaak over ‘een gesprek op gang brengen’. Maar wie kan eraan deelnemen — en hoe gaat dat gesprek verder?
      Reacties van bezoekers worden vaak verzameld, maar zelden met elkaar verbonden. Comment to Conversation onderzoekt wat er gebeurt als dat wel gebeurt — door mogelijkheden te creëren om kennis te nemen van wat anderen hebben gezegd, daarop te reageren en gesprekken zich in de loop van de tijd te laten ontvouwen.
      C2C vertrekt vanuit het idee van dialoog: niet simpelweg als spreken, maar als een proces waarin spreken van ons vraagt om te luisteren, en luisteren de mogelijkheid opent om te reageren.
      De gesprekken die je tegenkomt, volgen geen vast script. C2C herschikt bestaande reacties voortdurend om om verschillende verbanden zichtbaar te maken. Ze krijgen vorm door de mensen die deelnemen, de tentoonstelling waarop ze reageren en de ruimte die ze delen. Sommige zullen herkenning oproepen, uitdagen of verrassen — andere leiden misschien nergens toe, zoals dat soms ook met gesprekken gaat.
    fr:  |
      Les expositions parlent souvent de « lancer une conversation ». Mais qui peut y participer — et comment cette conversation peut-elle se poursuivre ?
      Les commentaires des visiteurs sont souvent recueillis, mais rarement mis en relation. Comment to Conversation explore ce qui se passe lorsqu’on les relie : vous pouvez découvrir ce que d’autres ont dit, leur répondre et permettre aux conversations de se développer au fil du temps.
      C2C part de l’idée du dialogue : il ne s’agit pas simplement de parler, mais d’un processus où parler nous invite à écouter, et où écouter ouvre la possibilité de répondre.
      Les conversations que vous découvrez ne suivent pas un scénario prédéfini. C2C réorganise continuellement les commentaires existants pour faire apparaître différents liens entre eux. Les conversations prennent forme à travers les personnes qui participent, l’exposition à laquelle elles réagissent et l’espace qu’elles partagent. Certaines peuvent faire écho, interpeller ou surprendre — d’autres ne mèneront nulle part, comme cela arrive parfois dans une conversation.
  
  how_it_works:
    en: How it Works
    nl: Hoe het werkt 
    fr: Comment ça marche
  comment_to_connections:
    en: From Comments to Connections
    nl: Van reacties naar verbanden
    fr: Des commentaires aux connexions
  connections:
    en: C2C uses computational methods to analyze possible relationships between existing visitor comments.
    nl: C2C gebruikt computationele methoden om mogelijke verbanden tussen bestaande bezoekersreacties te analyseren.
    fr: C2C utilise des méthodes computationnelles pour analyser les liens possibles entre les commentaires existants des visiteurs.  
  image_1:
    en: Finding references
    nl: Referenties zoeken
    fr: Rechercher des références  
  image_2:
    en: Making connections
    nl: Verbanden leggen
    fr: Créer des liens
    
  connections_to_conversations:
    en: From Connections to Conversations
    nl: Van verbanden naar gesprekken
    fr: Des connexions aux conversations
  conversations:
    en: C2C uses computational methods to analyze possible relationships between existing visitor comments.
    nl: C2C brengt reacties samen in steeds veranderende gesprekslijnen en creëert zo mogelijkheden voor ontmoeting en reactie.
    fr: C2C utilise des méthodes computationnelles pour analyser les liens possibles entre les commentaires existants des visiteurs.
  image_3:
    en: Following possible paths
    nl: Mogelijke paden volgen
    fr: Suivre des pistes possibles
  image_3:
    en: Forming conversational threads
    nl: Gesprekslijnen vormen
    fr: Former des fils de conversation
  bubbles:
    en: Rather than maximizing attention or reinforcing social bubbles, C2C repurposes social media algorithms towards curiosity, difference, and exchange within a shared civic space.
    nl: In plaats van aandacht te maximaliseren of sociale bubbels te versterken, zet C2C algoritmes uit sociale media in voor nieuwsgierigheid, verschil en uitwisseling binnen een gedeelde publieke ruimte.
    fr: Plutôt que de maximiser l’attention ou de renforcer les bulles sociales, C2C réutilise les algorithmes des réseaux sociaux pour favoriser la curiosité, la différence et l’échange au sein d’un espace public partagé.
  credits:
    en: C2C is developed by interaction design researcher Jon Stam and data scientist Valentin Vogelmann. The project is part of Jon Stam’s doctoral research at LUCA School of Arts and KU Leuven, which explores participatory mediation tools in museum spaces. Contact: jon.stam@luca-arts.be
        The project is made possible with the support of the Nationale Loterij Fonds voor Democratie, managed by the King Baudouin Foundation.
    nl: C2C is ontwikkeld door interactieontwerper en onderzoeker Jon Stam en datawetenschapper Valentin Vogelmann. Het project maakt deel uit van het doctoraatsonderzoek van Jon Stam aan LUCA School of Arts en KU Leuven naar participatieve bemiddeling in museale ruimtes. Contact: jon.stam@luca-arts.be
        Het project is mogelijk gemaakt met steun van het Nationale Loterij Fonds voor Democratie, beheerd door de Koning Boudewijnstichting.
    fr: C2C est développé par Jon Stam, chercheur et designer d’interaction, et Valentin Vogelmann, data scientist. Le projet fait partie de la recherche doctorale de Jon Stam à LUCA School of Arts et KU Leuven, consacrée aux outils de médiation participative dans les espaces muséaux. Contact : jon.stam@luca-arts.be
        Le projet est rendu possible grâce au soutien du Nationale Loterij Fonds voor Democratie, géré par la Fondation Roi Baudouin.


